<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 240px; font-family: system-ui, sans-serif; margin: 0; padding: 14px;
             background: #181b22; color: #e7e9ee; }
      h1 { font-size: 14px; margin: 0 0 12px; }
      .row { display: flex; align-items: center; justify-content: space-between; margin: 10px 0; }
      .status { font-size: 12px; }
      .ok { color: #4cd07d; } .bad { color: #ff6b6b; }
    </style>
  </head>
  <body>
    <h1 data-i18n="appName">STZ Downloader</h1>
    <div class="row">
      <label for="enabled" data-i18n="interceptDownloads">Intercept downloads</label>
      <input type="checkbox" id="enabled" />
    </div>
    <div class="row">
      <span data-i18n="statusLabel">Status</span>
      <span class="status" id="status">…</span>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
