<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 240px; font-family: system-ui, sans-serif; margin: 0; padding: 14px;
             background: #181b22; color: #e7e9ee; }
      h1 { font-size: 14px; margin: 0 0 12px; }
      .row { display: flex; align-items: center; justify-content: space-between; margin: 10px 0; }
      input[type=text] { width: 130px; background: #0f1115; border: 1px solid #2a2f3a;
                         color: #e7e9ee; border-radius: 6px; padding: 4px 6px; }
      .status { font-size: 12px; }
      .ok { color: #4cd07d; } .bad { color: #ff6b6b; }
    </style>
  </head>
  <body>
    <h1>stz downloader</h1>
    <div class="row">
      <label for="enabled">Interceptar downloads</label>
      <input type="checkbox" id="enabled" />
    </div>
    <div class="row">
      <label for="bridge">Bridge</label>
      <input type="text" id="bridge" />
    </div>
    <div class="row">
      <span>Status</span>
      <span class="status" id="status">…</span>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
